# 청첩장 자동 배포
# - 코드가 올라오면 바로 배포하고,
# - 혹시 자동으로 시작되지 않은 경우를 위해 30분마다 한 번 최신 코드로 다시 배포해요.
# 사용하려면 Settings → Pages → Source를 "GitHub Actions"로 설정하세요.
name: Deploy wedding invitation

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 휴대폰 브라우저가 예전 CSS·JS·사진을 붙잡고 있지 않도록, 배포할 때마다 주소 끝 ?v=dev 를 커밋 번호로 바꿔요
      - name: Cache busting
        run: |
          V=$(echo "$GITHUB_SHA" | cut -c1-8)
          sed -i "s/?v=dev/?v=$V/g" index.html js/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
