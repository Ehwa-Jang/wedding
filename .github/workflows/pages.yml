# 청첩장 자동 배포
# - 코드가 올라오면 바로 배포해요.
# - 필요하면 Actions 탭에서 "Run workflow" 버튼으로 직접 다시 배포할 수 있어요.
# 사용하려면 Settings → Pages → Source를 "GitHub Actions"로 설정하세요.
name: Deploy wedding invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) 사이트 파일을 묶어서 올리기
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 휴대폰 브라우저가 예전 CSS·JS·사진을 붙잡고 있지 않도록, 배포할 때마다 주소 끝 ?v=dev 를 커밋 번호로 바꿔요
      - name: Cache busting
        run: |
          V=$(echo "$GITHUB_SHA" | cut -c1-8)
          sed -i "s/?v=dev/?v=$V/g" index.html js/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # 2) 올린 묶음을 사이트에 반영하기 — 작업을 나눠 두면 사이에 몇 초 간격이 생겨서,
  #    GitHub가 방금 올린 묶음을 못 찾는 문제(2026년 11월)를 피할 수 있어요
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
